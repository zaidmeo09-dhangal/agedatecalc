<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% if page.meta_title %}{{ page.meta_title }} | {{ site.title }}{% elsif page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | Free Date and Time Tools{% endif %}</title>
<meta name="description" content="{% if page.meta_description %}{{ page.meta_description }}{% elsif page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.meta_title %}{{ page.meta_title }}{% elsif page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{% if page.meta_description %}{{ page.meta_description }}{% elsif page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% assign og_image = page.featured_image | default: page.image %}{% if og_image %}<meta property="og:image" content="{{ og_image | absolute_url }}">
<meta property="og:image:alt" content="{{ page.image_alt | default: page.title | escape }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ og_image | absolute_url }}">
<meta name="twitter:image:alt" content="{{ page.image_alt | default: page.title | escape }}">{% else %}<meta name="twitter:card" content="summary">{% endif %}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E6B62'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23FAF6EF' stroke-width='5'/%3E%3Cpath d='M32 22v10l7 5' fill='none' stroke='%23E9A13B' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}">
<script>
/* Set theme before paint: saved choice wins, otherwise system preference */
(function(){try{var t=localStorage.getItem("agedatecalc-theme");if(!t){t="light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
{% if page.schema %}
<script type="application/ld+json">
{{ page.schema }}
</script>
{% endif %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "AgeDateCalc",
  "url": "{{ '/' | absolute_url }}",
  "description": "Free online date and time tools: age calculator, date difference calculator, countdown timer, stopwatch, and time zone converter."
}
</script>
{% if page.layout == "post" and page.faqs_raw and page.faqs_raw != "" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% assign faq_blocks = page.faqs_raw | split: "---" %}
    {% assign first_faq = true %}
    {% for block in faq_blocks %}
      {% assign raw_lines = block | newline_to_br | split: "<br />" %}
      {% assign q = "" %}
      {% assign q_found = false %}
      {% capture a %}{% endcapture %}
      {% for l in raw_lines %}
        {% assign clean_l = l | strip %}
        {% if clean_l != "" %}
          {% if q_found == false %}
            {% assign q = clean_l %}
            {% assign q_found = true %}
          {% else %}
            {% capture a %}{{ a }}{% unless a == "" %} {% endunless %}{{ clean_l }}{% endcapture %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {% if q != "" %}{% unless first_faq %},{% endunless %}
      {
        "@type": "Question",
        "name": {{ q | jsonify }},
        "acceptedAnswer": {
          "@type": "Answer",
          "text": {{ a | jsonify }}
        }
      }{% assign first_faq = false %}{% endif %}
    {% endfor %}
  ]
}
</script>
{% endif %}
{% if page.layout == "post" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ page.title | escape }}",
  "description": "{{ page.description | escape }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Person",
    "name": "Zaid",
    "url": "{{ '/about/' | absolute_url }}"
  },{% assign bp_image = page.featured_image | default: page.image %}{% if bp_image %}
  "image": "{{ bp_image | absolute_url }}",{% endif %}
  "publisher": {
    "@type": "Organization",
    "name": "AgeDateCalc",
    "url": "{{ '/' | absolute_url }}"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ '/' | absolute_url }}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Blog",
      "item": "{{ '/blog/' | absolute_url }}"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{ page.title | escape }}",
      "item": "{{ page.url | absolute_url }}"
    }
  ]
}
</script>
{% endif %}
