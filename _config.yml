# AgeDateCalc - Jekyll configuration
title: AgeDateCalc
description: Free date and time tools. Calculate your exact age, count days between dates, run countdown timers, and convert time zones. No sign-up needed.
# Live on the custom domain agedatecalc.com
url: "https://agedatecalc.com"
baseurl: ""
# Publish posts dated in the future immediately (all 7 articles go live now)
future: true

# Defaults for blog posts created in PagesCMS: layout and /blog/slug/ URL
# are automatic, so new posts only need the fields in .pages.yml
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: "/blog/:title/"

# Build settings
markdown: kramdown
plugins:
  - jekyll-sitemap

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
